name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        env:
          SECRET_KEY: ci-test-secret-key
          HIS_DB_PATH: ${{ github.workspace }}/data/ci.db
          HIS_DATA_DIR: ${{ github.workspace }}/data
        run: python -m pytest tests -q --ignore=tests/e2e --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t his-app:ci .
