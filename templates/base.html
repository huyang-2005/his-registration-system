<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}门诊挂号分系统{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">医院信息系统 · 门诊挂号分系统</div>
  <nav>
    <a href="{{ url_for('index') }}">首页</a>
    <a href="{{ url_for('patients') }}">患者建档</a>
    <a href="{{ url_for('register') }}">门诊挂号</a>
    <a href="{{ url_for('registrations') }}">挂号查询</a>
    <a href="{{ url_for('schedules') }}">排班号源</a>
    <a href="{{ url_for('report') }}">统计报表</a>
  </nav>
</header>

<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<footer class="footer">门诊挂号分系统实训项目 · SQLite 演示数据</footer>
</body>
</html>
