<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 门诊挂号与收费发药分系统</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>医院信息系统</h1>
    <p class="muted">门诊挂号与收费发药分系统</p>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login?next={{ next }}">
      <div class="field"><label>用户名</label><input name="username" required autofocus></div>
      <div class="field"><label>密码</label><input type="password" name="password" required></div>
      <button type="submit" style="width:100%;margin-top:14px">登 录</button>
    </form>
    <div class="login-hint">
      <p>演示账号（密码均为 <b>His@123456</b>）：</p>
      <p>admin 管理员 · doctor 医生 · cashier 收费员 · pharmacist 药师</p>
    </div>
  </div>
</body>
</html>
